name: uidebienestar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^2.0.3+1

  provider: ^6.1.2
  dio: ^5.9.0
  dio_web_adapter: ^2.1.1
  intl: ^0.20.2
  uuid: ^4.4.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  google_fonts: ^8.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  flutter_launcher_icons: ^0.13.1
  

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/assets/images/imagen4.png
    - lib/assets/images/login.png

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/icon/icon.png"
  remove_alpha_ios: true